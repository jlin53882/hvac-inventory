<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庫存系統 v3 — 極簡快速版（現場速查/加減）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.4;
  }
  /* 巨型搜尋列 */
  .hero {
    background: #fff;
    padding: 24px 20px 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  .hero h1 { font-size: 22px; font-weight: 800; color: #111; }
  .hero .sub { font-size: 13px; color: #888; margin-top: 2px; }
  .big-search {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .big-search input {
    flex: 1;
    padding: 13px 18px;
    font-size: 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .big-search input:focus { border-color: #111; }
  .big-search .scan {
    background: #111;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 廠牌快速選單（chips） */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 20px 6px;
    max-width: 720px;
    margin: 0 auto;
  }
  .chip {
    padding: 6px 13px;
    border-radius: 16px;
    background: #f3f4f6;
    font-size: 12.5px;
    font-weight: 600;
    color: #444;
    cursor: pointer;
    border: none;
    transition: all 0.12s;
  }
  .chip:hover { background: #e5e7eb; }
  .chip.active { background: #111; color: #fff; }

  /* 列表 */
  .list { max-width: 720px; margin: 6px auto 0; padding: 0 20px 90px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 4px;
    border-bottom: 1px solid #f0f0f0;
  }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 15px; font-weight: 700; }
  .row-meta { font-size: 11.5px; color: #999; margin-top: 1px; }
  .row-meta .loc { color: #2d5a8e; }

  .qty {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 38px;
    height: 38px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    background: #fff;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    color: #111;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qty-btn:active { transform: scale(0.88); background: #f3f4f6; }
  .qty-btn.minus { color: #dc2626; }
  .qty-btn.plus { color: #16a34a; }
  .qty-num { font-size: 19px; font-weight: 800; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .qty-unit { font-size: 11px; color: #aaa; }

  /* 浮動儲存 */
  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s;
  }
  .fab:active { transform: scale(0.95); }
  .fab .badge {
    background: #ff5252;
    color: #fff;
    border-radius: 50%;
    font-size: 11px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
  }
  .empty { text-align: center; color: #aaa; padding: 60px 0; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 24px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    z-index: 100;
    pointer-events: none;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>

<div class="hero">
  <h1>🔍 庫存速查</h1>
  <div class="sub">輸入名稱 / 編號 快速找，按 + − 直接改數量</div>
  <div class="big-search">
    <input type="text" id="search" placeholder="輸入品名、編號…" autofocus>
    <button class="scan" onclick="toast('📷 掃條碼（模擬）')">📷</button>
  </div>
</div>

<div class="chips" id="chips"></div>

<div class="list" id="list"></div>

<button class="fab" onclick="save()" id="fab" style="display:none">
  💾 儲存 <span class="badge" id="badge">0</span>
</button>

<div class="toast" id="toast"></div>

<script src="data/stock-data.js"></script>
<script>
let currentBrand = '全部';
let dirty = {};
const ITEMS = STOCK_DATA;

function buildChips() {
  const counts = {};
  ITEMS.forEach(i => { counts[i.brand] = (counts[i.brand] || 0) + 1; });
  const brands = ['全部', ...Object.keys(counts).sort((a,b) => counts[b]-counts[a])];
  const el = document.getElementById('chips');
  el.innerHTML = '';
  brands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (b === currentBrand ? ' active' : '');
    btn.textContent = b;
    btn.onclick = () => { currentBrand = b; render(); };
    el.appendChild(btn);
  });
}

function render() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  let list = ITEMS;
  if (currentBrand !== '全部') list = list.filter(i => i.brand === currentBrand);
  if (kw) list = list.filter(i =>
    (i.name || '').toLowerCase().includes(kw) ||
    (i.code || '').toLowerCase().includes(kw)
  );

  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="big">🕳️</div>沒有找到「' + kw + '」</div>';
  } else {
    // 只顯示前 80 筆（mockup 流暢度）
    const shown = list.slice(0, 80);
    el.innerHTML = shown.map(i => {
      const qty = (dirty[i.code] !== undefined) ? dirty[i.code] : i.qty;
      const esc = s => (s || '').replace(/"/g, '&quot;');
      return `<div class="row">
        <div class="row-main">
          <div class="row-name">${esc(i.name)}</div>
          <div class="row-meta"><span class="loc">📍 ${esc(i.location)}</span>${i.code ? ' · ' + esc(i.code) : ''}${i.brand !== '無廠牌' ? ' · ' + esc(i.brand) : ''}</div>
        </div>
        <div class="qty">
          <button class="qty-btn minus" onclick="changeQty('${esc(i.code)}',-1)">−</button>
          <span class="qty-num">${qty}</span><span class="qty-unit">${esc(i.unit)}</span>
          <button class="qty-btn plus" onclick="changeQty('${esc(i.code)}',1)">+</button>
        </div>
      </div>`;
    }).join('');
    if (list.length > 80) {
      el.innerHTML += `<div class="empty" style="padding:20px">…還有 ${list.length - 80} 筆（mockup 僅顯示前 80）</div>`;
    }
  }

  const n = Object.keys(dirty).length;
  document.getElementById('fab').style.display = n ? 'flex' : 'none';
  document.getElementById('badge').textContent = n;
}

function changeQty(code, delta) {
  const item = ITEMS.find(i => i.code === code);
  if (!item) return;
  let q = (dirty[code] !== undefined) ? dirty[code] : item.qty;
  dirty[code] = Math.max(0, q + delta);
  render();
}

function save() {
  const n = Object.keys(dirty).length;
  toast(`✅ 已儲存 ${n} 項變更（模擬）`);
  dirty = {};
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

document.getElementById('search').addEventListener('input', render);
buildChips();
render();
</script>
</body>
</html>
