<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庫存系統 v2 — 側欄廠牌 + 資料表格版（桌面/管理用）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: #1a1a1a;
    line-height: 1.5;
    display: flex;
    min-height: 100vh;
    background: #f7f8fa;
  }
  /* 左側邊欄 */
  .sidebar {
    width: 220px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    padding: 16px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 15px;
    font-weight: 800;
    color: #1e3a5f;
    padding: 0 8px 12px;
    border-bottom: 1px solid #eee;
    margin-bottom: 8px;
  }
  .brand-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    margin-bottom: 2px;
    color: #444;
    transition: background 0.12s;
  }
  .brand-item:hover { background: #f0f4fa; }
  .brand-item.active { background: #2d5a8e; color: #fff; font-weight: 600; }
  .brand-item .cnt {
    font-size: 11px;
    background: #eef0f2;
    border-radius: 10px;
    padding: 1px 7px;
    color: #777;
  }
  .brand-item.active .cnt { background: rgba(255,255,255,0.25); color: #fff; }

  /* 主內容 */
  .main {
    flex: 1;
    padding: 20px 24px;
    min-width: 0;
  }
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .main-header h1 { font-size: 20px; color: #1e3a5f; }
  .main-header .meta { font-size: 13px; color: #888; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input {
    padding: 8px 14px;
    border: 1.5px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    width: 280px;
    outline: none;
  }
  .toolbar input:focus { border-color: #2d5a8e; }
  .toolbar .loc-filter {
    padding: 8px 14px;
    border: 1.5px solid #d0d5dd;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: #444;
  }

  /* 表格 */
  .table-wrap {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f8fafc;
    text-align: left;
    padding: 10px 12px;
    font-size: 12px;
    color: #666;
    font-weight: 700;
    border-bottom: 1.5px solid #e5e7eb;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  tbody tr:hover { background: #fafcff; }
  tr.low-stock td { background: #fff8e6; }
  tr.out-stock td { background: #fef2f2; }

  .brand-chip {
    display: inline-block;
    background: #eef4fa;
    color: #2d5a8e;
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 6px;
    padding: 2px 8px;
  }
  .loc-tag {
    display: inline-block;
    background: #f3f4f6;
    color: #666;
    font-size: 11.5px;
    border-radius: 6px;
    padding: 2px 8px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .qty-num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .qty-unit { font-size: 11px; color: #999; }

  /* 數量按鈕（表格內） */
  .qty-cell { display: flex; align-items: center; gap: 6px; }
  .mini-btn {
    width: 24px; height: 24px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  tr:hover .mini-btn { opacity: 1; }
  .mini-minus { background: #fee2e2; color: #dc2626; }
  .mini-plus { background: #dcfce7; color: #16a34a; }

  /* 狀態 */
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .status-ok { background: #22c55e; }
  .status-low { background: #f59e0b; }
  .status-out { background: #ef4444; }

  .empty { text-align: center; color: #999; padding: 50px 0; }

  .save-bar {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
  }
  .dirty-info { font-size: 13px; color: #666; }
  .btn {
    padding: 9px 22px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: #2d5a8e; color: #fff; }
  .btn-ghost {
    background: #fff; color: #555;
    border: 1.5px solid #d0d5dd;
  }
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: #333; color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>🏷️ 廠牌</h2>
  <div id="brand-list"></div>
</div>

<div class="main">
  <div class="main-header">
    <div>
      <h1 id="main-title">全部品項</h1>
      <div class="meta" id="main-meta"></div>
    </div>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇️ 匯出 Excel</button>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 搜尋名稱 / 編號 / 品牌…">
    <select class="loc-filter" id="loc-filter">
      <option value="">所有位置</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:70px">狀態</th>
          <th>廠牌</th>
          <th>編號</th>
          <th>名稱</th>
          <th>位置</th>
          <th style="width:130px">數量</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="save-bar">
    <span class="dirty-info" id="dirty-info"></span>
    <button class="btn btn-primary" onclick="saveAll()">💾 儲存全部變更</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data/stock-data.js"></script>
<script>
let currentBrand = '全部';
let dirty = {};
const ITEMS = STOCK_DATA;

// 側欄廠牌
function buildBrandList() {
  const counts = {};
  ITEMS.forEach(i => { counts[i.brand] = (counts[i.brand] || 0) + 1; });
  const brands = ['全部', ...Object.keys(counts).sort((a,b) => counts[b]-counts[a])];
  const el = document.getElementById('brand-list');
  el.innerHTML = '';
  brands.forEach(b => {
    const div = document.createElement('div');
    div.className = 'brand-item' + (b === currentBrand ? ' active' : '');
    div.innerHTML = `<span>${b}</span><span class="cnt">${counts[b] || ITEMS.length}</span>`;
    div.onclick = () => { currentBrand = b; render(); };
    el.appendChild(div);
  });
  // 更新標題
  document.getElementById('main-title').textContent = currentBrand === '全部' ? '全部品項' : currentBrand;
}

// 位置下拉
function buildLocFilter() {
  const locs = [...new Set(ITEMS.map(i => i.location))].sort();
  const sel = document.getElementById('loc-filter');
  locs.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    sel.appendChild(opt);
  });
}

function render() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const locF = document.getElementById('loc-filter').value;
  let list = ITEMS;
  if (currentBrand !== '全部') list = list.filter(i => i.brand === currentBrand);
  if (locF) list = list.filter(i => i.location === locF);
  if (kw) list = list.filter(i =>
    (i.name || '').toLowerCase().includes(kw) ||
    (i.code || '').toLowerCase().includes(kw) ||
    (i.brand || '').toLowerCase().includes(kw)
  );

  const tbody = document.getElementById('tbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">沒有符合的品項</td></tr>'; }
  else {
    tbody.innerHTML = list.map(i => {
      const qty = (dirty[i.code] !== undefined) ? dirty[i.code] : i.qty;
      const status = qty <= 0 ? 'out' : (qty <= 2 ? 'low' : 'ok');
      const statusMap = { ok: '充足', low: '偏低', out: '缺貨' };
      const esc = s => (s || '').replace(/"/g, '&quot;');
      return `<tr class="${status === 'low' ? 'low-stock' : ''}${status === 'out' ? 'out-stock' : ''}">
        <td><span class="status-dot status-${status}"></span>${statusMap[status]}</td>
        <td><span class="brand-chip">${esc(i.brand)}</span></td>
        <td style="color:#888;font-size:12px">${esc(i.code) || '—'}</td>
        <td><b>${esc(i.name)}</b></td>
        <td><span class="loc-tag" title="${esc(i.location)}">📍 ${esc(i.location)}</span></td>
        <td>
          <div class="qty-cell">
            <button class="mini-btn mini-minus" onclick="changeQty('${esc(i.code)}',-1)">−</button>
            <span class="qty-num">${qty}</span><span class="qty-unit">${esc(i.unit)}</span>
            <button class="mini-btn mini-plus" onclick="changeQty('${esc(i.code)}',1)">+</button>
          </div>
        </td>
        <td style="color:#b8860b;font-size:12px">${esc(i.note)}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('main-meta').textContent = `顯示 ${list.length} / ${ITEMS.length} 項`;
  document.getElementById('dirty-info').textContent = Object.keys(dirty).length ? `✏️ ${Object.keys(dirty).length} 項待儲存` : '';
}

function changeQty(code, delta) {
  const item = ITEMS.find(i => i.code === code);
  if (!item) return;
  let q = (dirty[code] !== undefined) ? dirty[code] : item.qty;
  dirty[code] = Math.max(0, q + delta);
  render();
}

function saveAll() {
  const n = Object.keys(dirty).length;
  if (!n) { toast('沒有變更'); return; }
  toast(`✅ 已儲存 ${n} 項（模擬）`);
  dirty = {};
  render();
}

function exportCSV() {
  // 模擬匯出
  toast('⬇️ 已產生 Excel（模擬）');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('loc-filter').addEventListener('change', render);
buildBrandList();
buildLocFilter();
render();
</script>
</body>
</html>
