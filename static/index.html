<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>振佳空調管理系統</title>
<!-- ============================================================
     資源版本號（?v=N）統一說明：
     本檔資源「不寫」版本號（刻意保持乾淨）——對外服務時，
     後端 main.py 的 _versioned_html() 會自動為每個 static 資源
     加上 ?v=檔案最後修改時間（mtime）。
     因此改 JS / CSS / 圖片「不需要」也「不應該」手動加版本號，
     存檔即自動生效；若手動加了，也會被自動取代。
     多 PR 並行也不衝突：每個資源各自獨立計算 mtime。
     ============================================================ -->
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1><img src="/static/img/logo-zhenjia.png" alt="振佳空調" class="topbar-logo"> 振佳空調管理系統</h1>
      <div class="sub" id="sub-info">載入中…</div>
    </div>
    <div class="top-actions">
          <button class="btn-ghost" id="btn-export" onclick="exportExcel()">⬇️ 匯出</button>
          <button class="btn-ghost" id="btn-add" onclick="openAddModal()">＋ 新增</button>
          <div class="user-menu" id="userMenu" style="display:none"></div>
          <button class="btn-icon" id="btn-menu" onclick="openTopMenu()" title="功能選單">☰</button>
        </div>
  </div>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="🔍 搜尋名稱 / 型號 / 位置 / 備註…">
  </div>
  <div class="site-tabs">
    <button class="site-tab active" id="site-office" onclick="switchSite('office')">
      🏢 辦公室<span class="sub" id="site-office-sub">…</span>
    </button>
    <button class="site-tab" id="site-warehouse" onclick="switchSite('warehouse')">
      🏭 倉庫<span class="sub" id="site-warehouse-sub">…</span>
    </button>
  </div>
</div>

<!-- 每月25日盤點提醒 -->
<div class="reminder" id="reminder" style="display:none">
  <span>📋 今天是 <b id="today-str"></b>，每月盤點日！請完成庫存盤點</span>
  <button onclick="switchTab('stocktake')">開始盤點</button>
</div>

<!-- 庫存頁：廠牌 tab -->
<div class="brand-tabs" id="brand-tabs" style="display:none"></div>

<div class="content" id="content">
  <div class="loading"><div class="spin"></div><div>載入庫存資料…</div></div>
</div>

<!-- 儲存列 -->
<div class="save-bar" id="save-bar">
  <div class="stat">修改 <b id="pending-count">0</b> 項</div>
  <button class="btn-save" id="btn-save" onclick="saveAll()">💾 全部儲存</button>
</div>

<!-- 底部導覽 -->
<div class="bottom-nav">
  <div class="nav-item-wrap">
    <button class="nav-item active" id="nav-inventory" onclick="switchTab('inventory')">
      <span class="ic">📦</span><span class="label">單一庫存</span>
    </button>
  </div>
  <div class="nav-item-wrap">
    <button class="nav-item" id="nav-prepared" onclick="switchTab('prepared')">
      <span class="ic">📤</span><span class="label">待領出</span><span class="badge" id="prepared-badge" style="display:none">0</span>
    </button>
  </div>
  <div class="nav-item-wrap">
    <button class="nav-item" id="nav-stockout" onclick="switchTab('stockout')">
      <span class="ic">🚚</span><span class="label">已領出</span>
    </button>
  </div>
  <div class="nav-item-wrap">
    <button class="nav-item" id="nav-stocktake" onclick="switchTab('stocktake')">
      <span class="ic">📋</span><span class="label">盤點</span>
    </button>
  </div>
  <div class="nav-item-wrap">
    <button class="nav-item" id="nav-kit" onclick="switchTab('kit')">
      <span class="ic">🔧</span><span class="label">整組庫存</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 新增品項 Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>➕ 新增品項</h3>
    <div class="form-2col">
      <div class="form-row">
        <label>廠牌</label>
        <input type="text" id="f-brand" list="brand-list" placeholder="例如：大金">
      </div>
      <div class="form-row">
        <label>型號</label>
        <input type="text" id="f-code" placeholder="例如：K031224">
      </div>
    </div>
    <div class="form-row">
      <label>品項名稱 *</label>
      <input type="text" id="f-name" placeholder="例如：變頻控制基板">
    </div>
    <!-- v10.1：新增時相似品項提示（防重複建筆） -->
    <div id="f-similar-warn" class="similar-warn" style="display:none"></div>
    <div class="form-2col">
      <div class="form-row">
        <label>數量</label>
        <input type="number" id="f-qty" value="0" min="0" step="any">
      </div>
      <div class="form-row">
        <label>分類位置</label>
        <select id="f-site">
          <option value="office">🏢 辦公室</option>
          <option value="warehouse">🏭 倉庫</option>
        </select>
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>單位</label>
        <select id="f-unit">
          <option>個</option><option>罐</option><option>瓶</option><option>包</option>
          <option>組</option><option>米</option><option>條</option><option>捲</option>
          <option>盤</option><option>套</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>位置</label>
      <input type="text" id="f-location" list="location-list" placeholder="例如：(有門的)三格木櫃">
    </div>
    <div class="form-row">
      <label>備註</label>
      <textarea id="f-note" placeholder="例如：第一層 右二"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('add-modal')">取消</button>
      <button class="btn-confirm" onclick="submitAdd()">確認新增</button>
    </div>
  </div>
</div>

<!-- 編輯品項 Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>✏️ 編輯品項</h3>
    <div class="form-2col">
      <div class="form-row">
        <label>廠牌</label>
        <input type="text" id="e-brand">
      </div>
      <div class="form-row">
        <label>型號</label>
        <input type="text" id="e-code">
      </div>
    </div>
    <div class="form-row">
      <label>品項名稱</label>
      <input type="text" id="e-name">
    </div>
    <!-- v10.1：編輯時相似品項提示（排除自己） -->
    <div id="e-similar-warn" class="similar-warn" style="display:none"></div>
    <!-- v10.1：品項照片（上傳/更換/刪除） -->
    <div class="form-row">
      <label>品項照片（手機可直接拍照）</label>
      <div class="photo-box" id="e-photo-box"></div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>單位</label>
        <select id="e-unit">
          <option>個</option><option>罐</option><option>瓶</option><option>包</option>
          <option>組</option><option>米</option><option>條</option><option>捲</option>
          <option>盤</option><option>套</option>
        </select>
      </div>
      <div class="form-row">
        <label>低庫存警示值</label>
        <input type="number" id="e-lowstock" min="0" step="any" placeholder="0 = 不警示">
      </div>
      <div class="form-row">
        <label>分類位置</label>
        <select id="e-site">
          <option value="office">🏢 辦公室</option>
          <option value="warehouse">🏭 倉庫</option>
        </select>
      </div>
    </div>
    <div class="form-row">
          <label>位置（放多處可之後用編輯新增）</label>
          <input type="text" id="e-location" list="location-list" placeholder="例如：編號A">
        </div>
        <div class="form-row">
          <label>位置清單（多位置管理）</label>
          <div id="edit-stock-rows"></div>
          <button type="button" class="btn-prepare" style="margin-top:0" onclick="addEditStockRow()">＋ 新增位置</button>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal('edit-modal')">取消</button>
          <button class="btn-confirm" onclick="submitEdit()">💾 儲存</button>
        </div>
  </div>
</div>

<!-- 已領出 Modal -->
<div class="modal-overlay" id="out-modal">
  <div class="modal">
    <h3>🚚 已領出</h3>
    <div class="form-row">
      <label>品項</label>
      <input type="text" id="o-item-name" disabled>
    </div>
    <div class="form-row">
          <label>目前庫存</label>
          <input type="text" id="o-item-stock" disabled>
        </div>
        <div class="form-row">
          <label>從哪個位置出（選填）</label>
          <select id="o-location">
            <option value="">全部位置（自動依序扣）</option>
          </select>
        </div>
        <div class="form-row">
          <label>領出數量 *</label>
          <input type="number" id="o-qty" min="0" step="any" placeholder="要扣多少">
        </div>
    <div class="form-row">
      <label>去哪裡（客戶 / 案場 / 工地）*</label>
      <input type="text" id="o-dest" list="dest-list" placeholder="例如：王先生-中山路案場">
    </div>
    <div class="form-row">
      <label>備註（選填）</label>
      <textarea id="o-note" placeholder="例如：安裝、維修、報廢…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('out-modal')">取消</button>
      <button class="btn-confirm orange" onclick="submitStockOut()">🚚 確認已領出</button>
    </div>
  </div>
</div>

<!-- 待領出 Modal -->
<div class="modal-overlay" id="prepare-modal">
  <div class="modal">
    <h3>📤 待領出</h3>
    <div class="form-row">
      <label>品項</label>
      <input type="text" id="p-item-name" disabled>
    </div>
    <div class="form-row">
      <label>目前庫存</label>
      <input type="text" id="p-item-stock" disabled>
    </div>
    <div class="form-row">
      <label>待領出數量 *</label>
      <input type="number" id="p-qty" min="0" step="any" placeholder="要領出多少（庫存先不扣）">
    </div>
    <div class="form-row">
      <label>準備說明（選填）</label>
      <textarea id="p-note" placeholder="例如：今天要去維修要帶的"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('prepare-modal')">取消</button>
      <button class="btn-confirm" style="background:#7c3aed" onclick="submitPrepare()">📤 確認待領出</button>
    </div>
  </div>
</div>

<!-- 待領出確認 Modal -->
<div class="modal-overlay" id="prepared-out-modal">
  <div class="modal">
    <h3>🚚 確認已領出</h3>
    <div class="form-row">
      <label>品項</label>
      <input type="text" id="po-item-name" disabled>
    </div>
    <div class="form-row">
      <label>待領出數量</label>
      <input type="text" id="po-item-prepared" disabled>
    </div>
    <div class="form-row">
      <label>確認已領出數量 *</label>
      <input type="number" id="po-qty" min="0" step="any" placeholder="從待領出扣掉（此時才扣庫存）">
    </div>
    <div class="form-row">
      <label>去哪裡（客戶 / 案場 / 工地）*</label>
      <input type="text" id="po-dest" list="dest-list" placeholder="例如：王先生-中山路案場">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('prepared-out-modal')">取消</button>
      <button class="btn-confirm orange" onclick="submitPreparedOut()">🚚 確認已領出</button>
    </div>
  </div>
</div>

<!-- 新增整組 Modal -->
<div class="modal-overlay" id="kit-modal">
  <div class="modal">
    <h3>🔧 新增整組</h3>
    <div class="form-row">
      <label>整組名稱 *</label>
      <input type="text" id="k-name" placeholder="例如：電磁閥套組">
    </div>
    <div class="form-row">
      <label>組成材料（每組需要的數量）</label>
      <div id="kit-comps"></div>
            <button class="btn-add-row" style="margin-top:0" onclick="addKitCompRow()">＋ 加入另一材料</button>
    </div>
    <div class="form-row">
      <label>備註（選填）</label>
      <input type="text" id="k-note" placeholder="例如：常用於維修">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('kit-modal')">取消</button>
      <button class="btn-confirm" onclick="submitKit()">✅ 建立整組</button>
    </div>
  </div>
</div>

<!-- 編輯已領出 Modal -->
<div class="modal-overlay" id="edit-stockout-modal">
  <div class="modal">
    <h3>✏️ 編輯已領出</h3>
    <div class="form-row">
      <label>品項</label>
      <input type="text" id="es-item-name" disabled>
    </div>
    <div class="form-row">
      <label>數量 *</label>
      <input type="number" id="es-qty" min="0" step="any" placeholder="已領出數量">
    </div>
    <div class="form-row">
      <label>去哪裡（客戶 / 案場 / 工地）</label>
      <input type="text" id="es-dest" list="dest-list" placeholder="例如：王先生-中山路案場">
    </div>
    <div class="form-row">
      <label>日期</label>
      <input type="datetime-local" id="es-datetime">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('edit-stockout-modal')">取消</button>
      <button class="btn-confirm orange" onclick="submitEditStockout()">💾 儲存</button>
    </div>
  </div>
</div>

<!-- 修改密碼 modal（v11.2 變體 B：密碼強度即時打勾） -->
<div class="modal-overlay" id="changepw-modal">
  <div class="modal">
    <h3>🔑 修改密碼</h3>
    <div class="form-row">
      <label>目前密碼</label>
      <input type="password" id="cpw-old" placeholder="輸入目前的密碼">
    </div>
    <div class="form-row">
      <label>新密碼</label>
      <input type="password" id="cpw-new" placeholder="至少 8 碼，含大小寫與數字" oninput="cpwCheckStrength()">
      <div class="pw-checks" id="cpw-checks">
        <span class="pw-check" id="cpw-len">⬜ 8 碼以上</span>
        <span class="pw-check" id="cpw-up">⬜ 含大寫</span>
        <span class="pw-check" id="cpw-low">⬜ 含小寫</span>
        <span class="pw-check" id="cpw-digit">⬜ 含數字</span>
      </div>
    </div>
    <div class="form-row">
      <label>確認新密碼</label>
      <input type="password" id="cpw-confirm" placeholder="再輸入一次新密碼" oninput="cpwCheckMatch()">
      <div class="cpw-mismatch" id="cpw-mismatch" style="display:none">⚠️ 兩次輸入的密碼不一致</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn-save" style="flex:2;margin-top:0" onclick="submitChangePw()">💾 儲存新密碼</button>
      <button class="btn-cancel-ghost" style="flex:1;margin-top:0" onclick="closeModal('changepw-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 密碼過期提示 modal（v11.2：6 個月未改密碼進站彈出） -->
<div class="modal-overlay" id="expiry-modal">
  <div class="modal" style="text-align:center">
    <div style="font-size:44px;margin-bottom:10px">🔒</div>
    <h3 style="margin-bottom:8px">密碼已超過 6 個月未更換</h3>
    <p style="font-size:13px;color:#666;line-height:1.6;margin-bottom:18px">為了帳號安全，建議更換密碼。<br>也可以選擇繼續使用目前的密碼。</p>
    <div style="display:flex;gap:10px">
      <button class="btn-save" style="flex:1;margin-top:0" onclick="expiryGoChangePw()">🔑 立即改密碼</button>
      <button class="btn-cancel" style="flex:1;margin-top:0" onclick="ackPasswordExpiry()">繼續使用原密碼</button>
    </div>
    <div style="font-size:11px;color:#aaa;margin-top:12px">選擇任一選項後，將再延長 6 個月</div>
  </div>
</div>

<!-- 重設密碼 modal（v11.2 變體 B：admin 重設他人密碼，樣式同個人改密碼） -->
<div class="modal-overlay" id="resetpw-modal">
  <div class="modal">
    <h3>🔑 重設密碼</h3>
    <div class="form-row">
      <label>新密碼</label>
      <input type="password" id="rpw-new" placeholder="至少 8 碼，含大小寫與數字" oninput="pwStrengthCheck('rpw-new')">
      <div class="pw-checks" id="rpw-checks">
        <span class="pw-check" id="rpw-len">⬜ 8 碼以上</span>
        <span class="pw-check" id="rpw-up">⬜ 含大寫</span>
        <span class="pw-check" id="rpw-low">⬜ 含小寫</span>
        <span class="pw-check" id="rpw-digit">⬜ 含數字</span>
      </div>
    </div>
    <div class="form-row">
      <label>確認新密碼</label>
      <input type="password" id="rpw-confirm" placeholder="再輸入一次新密碼" oninput="pwMatchCheck('rpw-new','rpw-confirm','rpw-mismatch')">
      <div class="cpw-mismatch" id="rpw-mismatch" style="display:none">⚠️ 兩次輸入的密碼不一致</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn-save" style="flex:2;margin-top:0" onclick="submitResetPw()">💾 儲存新密碼</button>
      <button class="btn-cancel-ghost" style="flex:1;margin-top:0" onclick="closeModal('resetpw-modal')">取消</button>
    </div>
  </div>
</div>

<datalist id="brand-list"></datalist>
<datalist id="location-list"></datalist>
<datalist id="dest-list"></datalist>

<script src="/static/js/globals.js" defer></script>
<script src="/static/js/auth.js" defer></script>
<script src="/static/js/utils.js" defer></script>
<script src="/static/js/api.js" defer></script>
<script src="/static/js/render/card.js" defer></script>
<script src="/static/js/render/inventory.js" defer></script>
<script src="/static/js/render/prepared.js" defer></script>
<script src="/static/js/render/stockout.js" defer></script>
<script src="/static/js/render/stocktake.js" defer></script>
<script src="/static/js/render/kits.js" defer></script>
<script src="/static/js/modals/edit.js" defer></script>
<script src="/static/js/modals/photo.js" defer></script>
<script src="/static/js/modals/add.js" defer></script>
<script src="/static/js/modals/stockout.js" defer></script>
<script src="/static/js/modals/kit.js" defer></script>
<script src="/static/js/permissions.js" defer></script>
<script src="/static/js/modals/users.js" defer></script>
<script src="/static/js/modals/changepw.js" defer></script>
<script src="/static/js/modals/expiry.js" defer></script>
<script src="/static/js/bottomsheet.js" defer></script>
<script src="/static/js/app.js" defer></script>
</body>
</html>
