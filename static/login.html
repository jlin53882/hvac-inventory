<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 登入｜振佳空調管理系統</title>
<link rel="stylesheet" href="/static/css/0-tokens/tokens.css">
<link rel="stylesheet" href="/static/css/4-pages/login.css">
</head>
<body data-page="login">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>

  <!-- 維護公告橫幅（需要時移除 hidden） -->
  <div class="announce" id="announce" hidden>⚠️ 系統維護通知：<span id="announceText"></span></div>

  <div class="login-wrap">
    <div class="login-panels">
      <!-- 左：品牌形象區（桌機） -->
      <div class="brand-panel">
        <div class="brand-panel-inner">
          <div class="big-logo"><img src="/static/img/login-hvac.png" alt="振佳空調"></div>
          <h2>振佳空調管理系統</h2>
          <p>冷凍空調材料庫存管理<br>單一材料・整組・位置追蹤・盤點</p>
          <div class="geo">▣ ▤ ▦</div>
        </div>
      </div>

      <!-- 右：表單操作區 -->
      <div class="form-panel">
        <div class="login-card">
          <div class="brand">
            <div class="logo"><img src="/static/img/login-hvac.png" alt="振佳空調"></div>
            <h1>振佳空調管理系統</h1>
            <div class="sub">請登入以繼續</div>
          </div>

          <div class="error-box" id="errorBox">⚠️ <span id="errorMsg"></span></div>

          <form id="loginForm" autocomplete="on" novalidate>
            <div class="field">
              <label for="username">帳號</label>
              <div class="wrap">
                <input type="text" id="username" placeholder="請輸入帳號" autocomplete="username" required>
              </div>
            </div>

            <div class="field pw-field">
              <label for="password">密碼</label>
              <div class="wrap">
                <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password" required>
                <button type="button" class="password-toggle" id="pwToggle" tabindex="-1">👁️</button>
              </div>
            </div>

            <div class="form-extra">
              <label class="remember"><input type="checkbox" id="remember"> 記住帳號</label>
              <a class="forgot" id="forgotLink" href="#">忘記密碼？</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
              <span id="btnText">🔓 登入</span>
            </button>
          </form>

          <!-- 登入成功覆蓋層 -->
          <div class="success-overlay" id="successOverlay">
            <div class="ok-icon">✅</div>
            <h2>登入成功！</h2>
            <p>即將進入庫存管理系統…</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-note">© 2026 振佳空調 ・ 庫存管理系統 v11.0</div>
  <div class="sys-status">🟢 系統狀態：運作正常 ・ v11.0</div>

<script>
(function () {
  'use strict';

  // 已登入（有 session）就直接進主頁
  fetch('/api/auth/me').then(r => {
    if (r.ok) window.location.href = '/';
  }).catch(() => {});

  const form       = document.getElementById('loginForm');
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const loginBtn   = document.getElementById('loginBtn');
  const btnText    = document.getElementById('btnText');
  const errorBox   = document.getElementById('errorBox');
  const errorMsg   = document.getElementById('errorMsg');
  const successOv  = document.getElementById('successOverlay');
  const rememberEl = document.getElementById('remember');
  const forgotLink = document.getElementById('forgotLink');

  // 記住帳號：載入時回填（只存帳號，不存密碼）
  try {
    const saved = localStorage.getItem('inv_username');
    if (saved) { usernameEl.value = saved; rememberEl.checked = true; }
  } catch (e) { /* localStorage 不可用就略過 */ }

  // 密碼顯示/隱藏
  const toggleBtn = document.getElementById('pwToggle');
  toggleBtn.addEventListener('click', () => {
    const show = passwordEl.type === 'password';
    passwordEl.type = show ? 'text' : 'password';
    toggleBtn.textContent = show ? '🙈' : '👁️';
  });

  function showError(msg, info) {
    errorMsg.textContent = msg;
    errorBox.classList.remove('is-open', 'info');
    void errorBox.offsetWidth;  // 重新觸發 shake 動畫
    if (info) errorBox.classList.add('info');
    errorBox.classList.add('is-open');
    if (!info) {
      passwordEl.classList.add('err');
      setTimeout(() => passwordEl.classList.remove('err'), 1500);
    }
  }

  // 忘記密碼：系統無信箱機制 → 提示聯絡管理員
  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    showError('請聯絡系統管理員重設密碼', true);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = usernameEl.value.trim();
    const p = passwordEl.value;

    if (!u) { showError('請輸入帳號'); usernameEl.focus(); return; }
    if (!p) { showError('請輸入密碼'); passwordEl.focus(); return; }

    loginBtn.disabled = true;
    btnText.textContent = '⏳ 登入中…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });

      if (res.status === 429) { showError('嘗試次數過多，請 15 分鐘後再試'); return; }
      if (res.status === 403) { showError('帳號已被停用，請聯絡管理員'); return; }
      if (!res.ok) { showError('帳號或密碼錯誤'); passwordEl.value = ''; passwordEl.focus(); return; }

      // 記住帳號（只存帳號）
      try {
        if (rememberEl.checked) localStorage.setItem('inv_username', u);
        else localStorage.removeItem('inv_username');
      } catch (err) {}

      // ✅ 成功：顯示覆蓋層 → 跳轉主頁
      successOv.classList.add('is-open');
      setTimeout(() => { window.location.href = '/'; }, 900);
    } catch (err) {
      showError('無法連線伺服器，請稍後再試');
    } finally {
      loginBtn.disabled = false;
      btnText.textContent = '🔓 登入';
    }
  });

  // 預先聚焦帳號欄
  usernameEl.focus();
})();
</script>
</body>
</html>
