<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號與權限 — 振佳空調管理系統</title>
<link rel="stylesheet" href="/static/css/0-tokens/tokens.css">
<link rel="stylesheet" href="/static/css/1-base/base.css">
<link rel="stylesheet" href="/static/css/2-layout/shell.css">
<link rel="stylesheet" href="/static/css/2-layout/topbar.css">
<link rel="stylesheet" href="/static/css/3-components/badge.css">
<link rel="stylesheet" href="/static/css/3-components/batch-bar.css">
<link rel="stylesheet" href="/static/css/3-components/bottomsheet.css">
<link rel="stylesheet" href="/static/css/3-components/button.css">
<link rel="stylesheet" href="/static/css/3-components/card.css">
<link rel="stylesheet" href="/static/css/3-components/chip.css">
<link rel="stylesheet" href="/static/css/3-components/drawer.css">
<link rel="stylesheet" href="/static/css/3-components/feedback.css">
<link rel="stylesheet" href="/static/css/3-components/form.css">
<link rel="stylesheet" href="/static/css/3-components/kpi.css">
<link rel="stylesheet" href="/static/css/3-components/lightbox.css">
<link rel="stylesheet" href="/static/css/3-components/location-editor.css">
<link rel="stylesheet" href="/static/css/3-components/location-headers.css">
<link rel="stylesheet" href="/static/css/3-components/modal.css">
<link rel="stylesheet" href="/static/css/3-components/notif-panel.css">
<link rel="stylesheet" href="/static/css/3-components/panel.css">
<link rel="stylesheet" href="/static/css/3-components/performance.css">
<link rel="stylesheet" href="/static/css/3-components/product-thumbnail.css">
<link rel="stylesheet" href="/static/css/3-components/save-bar.css">
<link rel="stylesheet" href="/static/css/3-components/status-list.css">
<link rel="stylesheet" href="/static/css/3-components/table.css">
<link rel="stylesheet" href="/static/css/4-pages/permissions.css">
<link rel="stylesheet" href="/static/css/5-utilities/utilities.css">
</head>
<body data-page="permissions">

<div class="topbar">
  <div class="topbar-left u-d-flex u-ai-center">
    <button class="btn btn--on-dark btn--sm btn--icon vb-back" onclick="location.href='/'" title="返回庫存">←</button>
    <span class="vb-crumb"><a href="/">庫存</a><span class="sep">›</span><span class="vb-crumb-current">帳號與權限</span></span>
  </div>
  <div class="top-actions u-d-flex u-ai-center u-gap-8 u-pr-12">
    <button class="btn btn--on-dark btn--sm btn-primary" onclick="openAddUserModal()">＋ 新增帳號</button>
    <button class="btn btn--on-dark btn--sm btn-ghost" onclick="location.href='/'">🏠 庫存</button>
  </div>
</div>

<div class="vb-content-title">
  <h2>🔐 帳號與權限</h2>
  <p>管理登入帳號、角色與各模組權限。變更立即生效，不需重新登入。</p>
</div>

<div class="chip-bar" id="chipBar"></div>

<div class="perm-layout">
  <aside class="user-list" id="userList"></aside>
  <main class="perm-main">
    <div class="perm-panel">
      <div class="panel-head" id="panelHead"></div>
      <div class="tabs">
        <button class="chip chip--seg tab is-active" data-tab="perms" onclick="switchTab('perms')">🔐 權限設定</button>
        <button class="chip chip--seg tab" data-tab="account" onclick="switchTab('account')">🔑 帳號設定</button>
      </div>
      <div id="tab-perms"></div>
      <div id="tab-account" style="display:none"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addUserOverlay">
  <div class="modal">
    <h3>＋ 新增帳號</h3>
    <div class="tabs u-m-0-0-12">
      <button class="chip chip--seg tab is-active" onclick="addUserMode('single')">單一新增</button>
      <button class="chip chip--seg tab" onclick="addUserMode('batch')">批次新增</button>
    </div>
    <div id="addSingle">
      <div class="cr-field"><label>帳號</label><input class="cr-input" id="nu-username" placeholder="登入用帳號"></div>
      <div class="cr-field"><label>顯示名稱</label><input class="cr-input" id="nu-display" placeholder="例如 王小明"></div>
      <div class="cr-field"><label>角色</label>
        <select class="cr-select" id="nu-role">
          <option value="user">👤 使用者（庫存全寫入）</option>
          <option value="tech">🔧 工程師（行事曆可寫、其他唯讀）</option>
          <option value="viewer">👀 檢視者（全唯讀）</option>
          <option value="admin">🛡️ 管理員</option>
        </select>
      </div>
      <div class="cr-field"><label>密碼（8 碼以上，含大小寫與數字）</label><input class="cr-input" type="password" id="nu-password"></div>
    </div>
    <div id="addBatch" style="display:none">
      <div class="cr-field"><label>每行一筆：帳號, 顯示名稱, 角色（admin/user/tech/viewer）, 密碼</label>
        <textarea class="batch-textarea" id="nu-batch" placeholder="例如：&#10;alice, 王小明, user, Pass1234&#10;bob, 陳大文, tech, Pass5678"></textarea>
      </div>
      <div class="batch-result" id="nu-batch-result"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn--secondary btn--md btn-ghost" onclick="closeAddUserModal()">取消</button>
      <button class="btn btn--primary btn--md btn-primary" id="nu-submit" onclick="submitAddUser()">建立</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="accountEditOverlay">
  <div class="modal">
    <h3>✏️ 編輯帳號</h3>
    <div class="account-edit-field">
      <label for="ae-display-name">顯示名稱</label>
      <input class="account-edit-input" id="ae-display-name" maxlength="100" autocomplete="off">
    </div>
    <div class="account-edit-field">
      <label for="ae-role">角色</label>
      <select class="account-edit-select" id="ae-role">
        <option value="user">👤 使用者（庫存全寫入）</option>
        <option value="tech">🔧 工程師（行事曆可寫、其他唯讀）</option>
        <option value="viewer">👀 檢視者（全唯讀）</option>
        <option value="admin">🛡️ 管理員</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn--secondary btn--md btn-ghost" onclick="closeAccountEditModal()">取消</button>
      <button class="btn btn--primary btn--md btn-primary" onclick="submitAccountEdit()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="resetPwOverlay">
  <div class="modal">
    <h3>🔑 重設密碼</h3>
    <p class="u-fs-13 u-c-666 u-m-0-0-10" id="resetPwTarget"></p>
    <div class="cr-field"><label>新密碼（8 碼以上，含大小寫與數字）</label><input class="cr-input" type="password" id="rp-password"></div>
    <div class="modal-actions">
      <button class="btn btn--secondary btn--md btn-ghost" onclick="closeResetPwModal()">取消</button>
      <button class="btn btn--primary btn--md btn-primary" onclick="submitResetPw()">重設</button>
    </div>
  </div>
</div>

<!-- 2026-08-15 家豪選定：重設為角色預設 確認 modal（取代原生 confirm） -->
<div class="modal-overlay" id="resetPermOverlay">
  <div class="modal">
    <h3>⚠️ 重設為角色預設？</h3>
    <div class="warn-box">此操作會清除 <span id="resetPermTarget"></span> 的所有個人權限覆寫。</div>
    <p class="u-fs-13 u-c-666 u-m-10-0-0">重設後，此帳號的權限將完全跟隨角色預設（<span id="resetPermRole"></span>）。原本「✏️ 自訂」的開關會全部還原，此動作無法復原。</p>
    <div class="modal-actions">
      <button class="btn btn--secondary btn--md btn-ghost" onclick="closeResetPermModal()">取消</button>
      <button class="btn btn--danger btn--md" onclick="confirmResetPerm()">確定重設</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/globals.js" defer></script>
<script src="/static/js/utils.js" defer></script>
<script src="/static/js/api.js" defer></script>
<script src="/static/js/perms.js" defer></script>
</body>
</html>
