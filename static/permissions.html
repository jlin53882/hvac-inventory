<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號與權限 — 振佳空調管理系統</title>
<link rel="stylesheet" href="/static/css/style.core.css">
<style>
/* ===== 帳號與權限頁（RBAC 2026-08-13：桌面 3-B / 手機 M1 chip）=====
   2026-08-15 家豪選定：頂欄改「變體 B 麵包屑式」——topbar 輕量化（← + 庫存 › 帳號與權限），
   頁面大標題下移到內容區左上、與左側 user-list 對齊 */
.perm-layout { display: flex; gap: 16px; padding: 16px 16px 90px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }

/* 覆寫全域 .topbar：權限頁改麵包屑式（display flex + 較矮 padding） */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; }
.vb-back { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.35); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
.vb-back:hover { background: rgba(255,255,255,0.25); }
.vb-crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.85); margin-left: 12px; }
.vb-crumb a { color: rgba(255,255,255,0.75); text-decoration: none; }
.vb-crumb a:hover { text-decoration: underline; }
.vb-crumb .sep { opacity: .5; }
.vb-crumb .vb-crumb-current { color: #fff; font-weight: 600; }

/* 內容區上方頁面大標題（與 user-list 頂端對齊） */
.vb-content-title { max-width: 1200px; margin: 16px auto 0; padding: 0 16px; }
.vb-content-title h2 { font-size: 20px; font-weight: 700; color: #1a1a1a; }
.vb-content-title p { font-size: 12.5px; color: #888; margin-top: 3px; }
.user-list { width: 250px; flex-shrink: 0; background: #fff; border-radius: 12px; border: 1px solid #eee; overflow: hidden; }
.user-list-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background .15s; }
.user-list-item:last-child { border-bottom: none; }
.user-list-item:hover { background: #f7fbff; }
.user-list-item.active { background: #e6f4ff; border-left: 3px solid #1890ff; }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #1890ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.user-avatar.off { background: #bbb; }
.user-meta { flex: 1; min-width: 0; }
.user-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-name .me-tag { color: #999; font-size: 12px; font-weight: 400; }
.user-sub { font-size: 12px; color: #888; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.status-dot.on { background: #52c41a; }
.status-dot.off { background: #ff4d4f; }

.perm-main { flex: 1; min-width: 0; }
.perm-panel { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 18px 20px; }
.panel-head { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #f0f0f0; }
.panel-head .user-avatar { width: 44px; height: 44px; font-size: 19px; }
.panel-title { font-size: 17px; font-weight: 700; }
.panel-sub { font-size: 12px; color: #888; margin-top: 2px; }

.tabs { display: flex; gap: 6px; margin: 14px 0 4px; border-bottom: 1px solid #eee; }
.tab { padding: 9px 16px; border: none; background: none; font-size: 14px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; }
.tab.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }

.perm-group { margin-top: 12px; }
.perm-group-title { font-size: 12px; color: #999; font-weight: 600; margin-bottom: 6px; padding-left: 2px; }
.perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.perm-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border: 1px solid #f0f0f0; border-radius: 8px; background: #fafafa; }
.perm-row.locked { background: #f5f5f5; opacity: .75; }
.perm-label { font-size: 13.5px; }
.perm-label small { display: block; color: #999; font-size: 11.5px; margin-top: 1px; }
.perm-src { font-size: 11px; color: #999; margin-left: 8px; white-space: nowrap; }
.perm-src.override { color: #fa8c16; }
.perm-src.role { color: #52c41a; }
.perm-src.locked { color: #bfbfbf; }

/* 開關（iOS 風格）——2026-08-14 修正紀錄：
   第一/二輪：transition 限縮→移除動畫（誤判為動畫殘影，無效）
   第三輪：transform→left（仍無效——因為根本不是動畫問題）
   第四輪（根因）：style.css 有行事曆設定頁的 .switch（button 結構，.switch::after 白圈 left:2px 不動），
   與本頁 label+slider 結構的 .switch class 撞名 → 每個開關多出一個永遠停在左邊的白圈（「左邊圓圈還存在」）！
   解法：覆寫 .switch::after 為 content:none，並清掉 style.css 的 label 背景 */
.switch::after { content: none; }
.switch { background: transparent; }
.switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
.switch .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: none; cursor: pointer; }
.switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: none; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: #1890ff; }
.switch input:checked + .slider::before { left: 21px; }
.switch input:disabled + .slider { cursor: not-allowed; opacity: .55; }

/* save-bar：2026-08-15 家豪選定方案 B——桌面+手機都是 fixed 底部底條（sticky），
   權限列多時按鈕常駐可見；內容區底部留 padding 防遮擋 */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 1px solid #e5e9f0;
  box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  padding: 10px 20px; z-index: 95;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.save-bar-inner { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.save-hint { font-size: 12.5px; color: #999; }
.save-hint.changed { color: #fa8c16; font-weight: 600; }
.save-btns { display: flex; gap: 8px; }
.save-btns .btn-primary, .save-btns .btn-ghost { padding: 8px 16px; }
/* 2026-08-15 根因修復：.btn-ghost 全域樣式是 topbar 專用（白字半透明白底），
   用在白底 save-bar 上會「白字白底隱形」——重設按鈕因此看不見。
   這裡覆寫成白底深字版（灰邊框），桌面+手機共用 */
.save-btns .btn-ghost {
  background: #fff;
  border: 1.5px solid #d0d5dd;
  color: #555;
}
.save-btns .btn-ghost:hover { background: #f5f7fa; }
.save-btns .btn-ghost:disabled { opacity: .55; cursor: not-allowed; }

/* Permission feature sub-tabs, filters, and pagination */
.perm-subtabs { display:flex; gap:6px; margin:14px 0 12px; border-bottom:1px solid #eee; }
.perm-subtab { padding:8px 14px; border:0; background:none; color:#666; cursor:pointer; border-bottom:2px solid transparent; font-size:13px; }
.perm-subtab.active { color:#1890ff; border-bottom-color:#1890ff; font-weight:600; }
.perm-toolbar { display:grid; gap:10px; margin-bottom:10px; }
.perm-search-label { font-size:12px; color:#666; }
.perm-search { width:100%; box-sizing:border-box; padding:9px 11px; border:1px solid #d9d9d9; border-radius:7px; font-size:14px; }
.perm-module-filter { display:flex; flex-wrap:wrap; gap:6px; }
.perm-filter { border:1px solid #d9d9d9; background:#fff; color:#666; border-radius:16px; padding:6px 11px; font-size:12px; cursor:pointer; }
.perm-filter.active { color:#1890ff; border-color:#1890ff; background:#e6f4ff; }
.perm-list { display:grid; gap:8px; }
.perm-empty { padding:24px 12px; text-align:center; color:#999; border:1px dashed #d9d9d9; border-radius:8px; }
.perm-pagination { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; color:#777; font-size:12px; }
.perm-page-buttons { display:flex; align-items:center; gap:8px; }
.perm-page-btn { border:1px solid #d9d9d9; background:#fff; border-radius:6px; padding:6px 9px; cursor:pointer; font-size:12px; }
.perm-page-btn:disabled { opacity:.45; cursor:not-allowed; }

/* 帳號設定 tab */
.account-card { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.account-field { padding: 10px 12px; border: 1px solid #f0f0f0; border-radius: 8px; background: #fafafa; }
.account-field .k { font-size: 12px; color: #999; }
.account-field .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
.account-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.account-edit-field { margin-bottom: 12px; }
.account-edit-field label { display: block; font-size: 12.5px; color: #555; }
.account-edit-input, .account-edit-select { width: 100%; padding: 9px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; margin-top: 4px; box-sizing: border-box; }
.account-actions .btn-danger { background: #ff4d4f; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.account-actions .btn-danger:hover { background: #d9363e; }
/* 2026-08-15：重設確認 modal 的紅色確定鈕（modal 內獨立定義，非 .account-actions 子層） */
.modal .btn-danger { background: #ff4d4f; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.modal .btn-danger:hover { background: #d9363e; }
/* 2026-08-15：modal 內「取消」也是 .btn-ghost（topbar 白字樣式），白底 modal 上看不見——覆寫白底深字 */
.modal .btn-ghost { background: #fff; border: 1.5px solid #d0d5dd; color: #555; }
.modal .btn-ghost:hover { background: #f5f7fa; }
.btn-warn { background: #faad14; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-warn:hover { background: #d48806; }
.warn-box { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #fff7e6; border: 1px solid #ffd591; font-size: 12.5px; color: #ad6800; }

/* 手機：chip 列（M1）取代左列表 */
.chip-bar { display: none; overflow-x: auto; gap: 8px; padding: 12px 16px 2px; scrollbar-width: none; }
.chip-bar::-webkit-scrollbar { display: none; }
.chip { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 18px; border: 1px solid #e0e0e0; background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.active { background: #1890ff; color: #fff; border-color: #1890ff; }
.chip .status-dot { width: 7px; height: 7px; }
.chip.off { opacity: .6; }


@media (max-width: 768px) {
  .perm-layout { padding: 0 0 110px; }
  .user-list { display: none; }
  .chip-bar { display: flex; }
  .perm-main { padding: 0 12px 12px; }
  .perm-grid { grid-template-columns: 1fr; }
  .perm-pagination { align-items:stretch; flex-direction:column; }
  .perm-page-buttons { justify-content:space-between; }
  .perm-page-btn { min-height:36px; }
  .perm-subtab { flex:1; padding-inline:6px; }
  /* 2026-08-15 變體 B：手機 topbar 只留「← + 帳號與權限」，麵包屑「庫存 ›」隱藏；內容區大標題隱藏（topbar 已顯示，避免重複） */
  .topbar { padding: 10px 14px; }
  .vb-crumb { margin-left: 10px; font-size: 15px; }
  .vb-crumb a, .vb-crumb .sep { display: none; }
  .vb-content-title { display: none; }
  /* 2026-08-15 方案 B 手機版：save-bar 改 column——提示置中在上、雙鈕等寬在下 */
  .save-bar { padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 6px; }
  .save-bar-inner { flex-direction: column; gap: 6px; }
  .save-hint { font-size: 11.5px; text-align: center; width: 100%; }
  .save-btns { width: 100%; display: flex; gap: 8px; }
  .save-btns .btn-primary, .save-btns .btn-ghost { flex: 1; padding: 10px 0; text-align: center; }
}

/* 新增帳號 modal（權限頁內嵌，沿用既有 modal 樣式） */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 18px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.cr-input, .cr-select { width: 100%; padding: 9px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; margin-top: 4px; box-sizing: border-box; }
.cr-field { margin-bottom: 12px; }
.cr-field label { font-size: 12.5px; color: #555; }
.batch-textarea { width: 100%; min-height: 110px; padding: 9px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; box-sizing: border-box; font-family: inherit; margin-top: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.batch-result { margin-top: 10px; font-size: 12.5px; max-height: 140px; overflow-y: auto; }
.batch-result .ok { color: #52c41a; }
.batch-result .err { color: #ff4d4f; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left" style="display:flex;align-items:center">
    <button class="vb-back" onclick="location.href='/'" title="返回庫存">←</button>
    <span class="vb-crumb"><a href="/">庫存</a><span class="sep">›</span><span class="vb-crumb-current">帳號與權限</span></span>
  </div>
  <div class="top-actions" style="display:flex;align-items:center;gap:8px;padding-right:12px">
    <button class="btn-primary" onclick="openAddUserModal()">＋ 新增帳號</button>
    <button class="btn-ghost" onclick="location.href='/'">🏠 庫存</button>
  </div>
</div>

<div class="vb-content-title">
  <h2>🔐 帳號與權限</h2>
  <p>管理登入帳號、角色與各模組權限。變更立即生效，不需重新登入。</p>
</div>

<div class="chip-bar" id="chipBar"></div>

<div class="perm-layout">
  <aside class="user-list" id="userList"></aside>
  <main class="perm-main">
    <div class="perm-panel">
      <div class="panel-head" id="panelHead"></div>
      <div class="tabs">
        <button class="tab active" data-tab="perms" onclick="switchTab('perms')">🔐 權限設定</button>
        <button class="tab" data-tab="account" onclick="switchTab('account')">🔑 帳號設定</button>
      </div>
      <div id="tab-perms"></div>
      <div id="tab-account" style="display:none"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addUserOverlay">
  <div class="modal">
    <h3>＋ 新增帳號</h3>
    <div class="tabs" style="margin:0 0 12px">
      <button class="tab active" onclick="addUserMode('single')">單一新增</button>
      <button class="tab" onclick="addUserMode('batch')">批次新增</button>
    </div>
    <div id="addSingle">
      <div class="cr-field"><label>帳號</label><input class="cr-input" id="nu-username" placeholder="登入用帳號"></div>
      <div class="cr-field"><label>顯示名稱</label><input class="cr-input" id="nu-display" placeholder="例如 王小明"></div>
      <div class="cr-field"><label>角色</label>
        <select class="cr-select" id="nu-role">
          <option value="user">👤 使用者（庫存全寫入）</option>
          <option value="tech">🔧 工程師（行事曆可寫、其他唯讀）</option>
          <option value="viewer">👀 檢視者（全唯讀）</option>
          <option value="admin">🛡️ 管理員</option>
        </select>
      </div>
      <div class="cr-field"><label>密碼（8 碼以上，含大小寫與數字）</label><input class="cr-input" type="password" id="nu-password"></div>
    </div>
    <div id="addBatch" style="display:none">
      <div class="cr-field"><label>每行一筆：帳號, 顯示名稱, 角色（admin/user/tech/viewer）, 密碼</label>
        <textarea class="batch-textarea" id="nu-batch" placeholder="例如：&#10;alice, 王小明, user, Pass1234&#10;bob, 陳大文, tech, Pass5678"></textarea>
      </div>
      <div class="batch-result" id="nu-batch-result"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddUserModal()">取消</button>
      <button class="btn-primary" id="nu-submit" onclick="submitAddUser()">建立</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="accountEditOverlay">
  <div class="modal">
    <h3>✏️ 編輯帳號</h3>
    <div class="account-edit-field">
      <label for="ae-display-name">顯示名稱</label>
      <input class="account-edit-input" id="ae-display-name" maxlength="100" autocomplete="off">
    </div>
    <div class="account-edit-field">
      <label for="ae-role">角色</label>
      <select class="account-edit-select" id="ae-role">
        <option value="user">👤 使用者（庫存全寫入）</option>
        <option value="tech">🔧 工程師（行事曆可寫、其他唯讀）</option>
        <option value="viewer">👀 檢視者（全唯讀）</option>
        <option value="admin">🛡️ 管理員</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAccountEditModal()">取消</button>
      <button class="btn-primary" onclick="submitAccountEdit()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="resetPwOverlay">
  <div class="modal">
    <h3>🔑 重設密碼</h3>
    <p style="font-size:13px;color:#666;margin:0 0 10px" id="resetPwTarget"></p>
    <div class="cr-field"><label>新密碼（8 碼以上，含大小寫與數字）</label><input class="cr-input" type="password" id="rp-password"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeResetPwModal()">取消</button>
      <button class="btn-primary" onclick="submitResetPw()">重設</button>
    </div>
  </div>
</div>

<!-- 2026-08-15 家豪選定：重設為角色預設 確認 modal（取代原生 confirm） -->
<div class="modal-overlay" id="resetPermOverlay">
  <div class="modal">
    <h3>⚠️ 重設為角色預設？</h3>
    <div class="warn-box">此操作會清除 <span id="resetPermTarget"></span> 的所有個人權限覆寫。</div>
    <p style="font-size:13px;color:#666;margin:10px 0 0">重設後，此帳號的權限將完全跟隨角色預設（<span id="resetPermRole"></span>）。原本「✏️ 自訂」的開關會全部還原，此動作無法復原。</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeResetPermModal()">取消</button>
      <button class="btn-danger" onclick="confirmResetPerm()">確定重設</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/globals.js" defer></script>
<script src="/static/js/utils.js" defer></script>
<script src="/static/js/api.js" defer></script>
<script src="/static/js/perms.js" defer></script>
</body>
</html>
