name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.5"

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        shell: bash
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Install locked dependencies
        shell: bash
        run: uv sync --locked --group dev
      - name: Run complete test suite
        shell: bash
        env:
          JUNITXML: test-results-${{ matrix.python-version }}.xml
        run: bash scripts/run-tests.sh all
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        shell: bash
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Verify locked dependency graph
        shell: bash
        run: uv lock --check
      - name: Install locked dependencies
        shell: bash
        run: uv sync --locked --group dev
      - name: Compile Python sources
        shell: bash
        run: .venv/Scripts/python.exe -m compileall -q app tests
      - name: Check whitespace errors
        shell: bash
        run: git -c core.whitespace=cr-at-eol diff --check

  ci-status:
    name: CI status
    if: always()
    needs: [test, quality]
    runs-on: windows-latest
    steps:
      - shell: bash
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.quality.result }}" != "success" ]; then exit 1; fi
